name: post-main conformance

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  post-main:
    name: Post-main Go 1.27 verification
    runs-on: ubuntu-latest
    steps:
      - name: Check out merged revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Go 1.27.0
        uses: actions/setup-go@v6
        with:
          go-version: '1.27.0'
          cache: false
      - name: Run authoritative post-main verification
        shell: bash
        run: bash scripts/ci-verify.sh
      - name: Upload caller-owned evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gooo-semantic-change-impact-analyzer-main-${{ github.run_id }}
          path: ${{ runner.temp }}/gooo-semantic-change-impact-analyzer-${{ github.run_id }}
          if-no-files-found: warn
